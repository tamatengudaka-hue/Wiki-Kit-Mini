<!DOCTYPE html>
<html lang="ja" data-language-pending>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wiki</title>

    <script src="./src/theme.js"></script>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <header class="site-header">
        <button
            id="sidebar-toggle"
            class="mobile-menu-button"
            type="button"
            aria-label="メニューを開く" data-i18n-label="メニューを開く"
            aria-controls="sidebar"
            aria-expanded="false"
        >
            ☰
        </button>

        <a href="./" id="wiki-name">Wiki</a>

        <a href="./?page=all" class="header-articles" data-i18n="記事一覧">
            記事一覧
        </a>

        <div class="search-area">
            <input
                id="search"
                type="search"
                placeholder="記事を検索..." data-i18n-placeholder="記事を検索..."
                autocomplete="off"
                role="combobox"
                aria-label="記事を検索" data-i18n-label="記事を検索"
                aria-autocomplete="list"
                aria-controls="search-options"
                aria-expanded="false"
            >

            <div id="search-results" hidden></div>
        </div>

        <button id="theme-toggle" class="theme-toggle" type="button">
            <span class="theme-prefix">配色：</span><span id="theme-label">自動</span>
        </button>

        <button
        id="toc-toggle"
        class="mobile-toc-button"
        type="button"
        aria-label="目次を開く" data-i18n-label="目次を開く"
        aria-controls="toc-panel"
        aria-expanded="false"
        hidden
    >
        <span data-i18n="目次">目次</span>
    </button>
    </header>

    <div class="wiki-layout">
        <aside id="sidebar" class="wiki-sidebar">
            <nav>
                <h2 data-i18n="ナビゲーション">ナビゲーション</h2>

                <a href="./" data-i18n="ホーム">ホーム</a>
                <a href="?page=all" data-i18n="記事一覧">記事一覧</a>
            </nav>

            <section>
                <h2 data-i18n="タグ">タグ</h2>

                <div id="sidebar-tags"></div>
            </section>

            <section class="language-settings">
                <label for="language-select" data-i18n="表示言語">表示言語</label>
                <select id="language-select">
                    <option value="ja" lang="ja">日本語</option>
                    <option value="en" lang="en">English</option>
                </select>
            </section>

            <section class="wiki-stats">
                <h2 data-i18n="Wiki情報">Wiki情報</h2>

                <p>
                    <span id="article-count">0</span> <span data-i18n="記事">記事</span>
                </p>

                <p>
                    <span id="tag-count">0</span> <span data-i18n="タグ">タグ</span>
                </p>
            </section>
        </aside>

        <main id="article">
            <p>Loading...</p>
        </main>

        <aside
        id="toc-panel"
        class="toc-panel"
        hidden
        ></aside>
    </div>

    <div id="mobile-backdrop" class="mobile-backdrop"></div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
